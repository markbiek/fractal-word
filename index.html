<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fractal Word</title>
	<style>
		:root {
			--bg: #111111;
			/* One color per letter of the small word, in word order. */
			--letter-0: #ff6b6b;
			--letter-1: #ffb347;
			--letter-2: #6bd968;
			--letter-3: #5aa9ff;
			--letter-4: #b58cff;
			--letter-5: #ffe066;
			--letter-6: #4dd4c6;
			--letter-7: #ff7ac8;
			--text: #e8e8e8;
			--muted: #8a8a8a;
			--field: #1c1c1c;
			--field-border: #333333;
		}
		html, body {
			margin: 0;
			background: var(--bg);
		}
		canvas {
			display: block;
			width: 100%;
		}
		canvas[hidden] {
			display: none;
		}
		form {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 8px;
			padding: 24px 16px 0;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
		}
		input {
			width: 12ch;
			padding: 8px 12px;
			font: inherit;
			font-size: 24px;
			letter-spacing: 0.2em;
			text-align: center;
			text-transform: uppercase;
			color: var(--text);
			background: var(--field);
			border: 1px solid var(--field-border);
			border-radius: 6px;
		}
		.hint {
			margin: 0;
			min-height: 1.2em;
			font-size: 14px;
			color: var(--muted);
		}
	</style>
</head>
<body>
	<form id="word-form">
		<input id="word" aria-label="Word to draw" autocomplete="off" autocapitalize="characters" spellcheck="false">
		<p id="hint" class="hint"></p>
	</form>
	<canvas id="fractal"></canvas>
	<script type="module">
		import { buildRules, iterate, wordSize } from './ifs.js';
		import { normalizeWord, MIN_WORD_LENGTH, MAX_WORD_LENGTH } from './word.js';

		const DEFAULT_WORD = 'SPAM';
		const TYPING_DEBOUNCE_MS = 300;
		// Scaled by devicePixelRatio squared, so a high-density screen gets the
		// same number of points per pixel as a standard one.
		const ITERATIONS_PER_CSS_PIXEL_RATIO = 1000000;
		const BURN_IN = 20;
		const BRIGHTNESS_PERCENTILE = 0.9;
		const MARGIN_RATIO = 0.05;
		const RESIZE_DEBOUNCE_MS = 150;

		const canvas = document.getElementById('fractal');
		const context = canvas.getContext('2d');
		const form = document.getElementById('word-form');
		const input = document.getElementById('word');
		const hint = document.getElementById('hint');

		let word = '';
		let rules = [];

		function cssColor(name) {
			return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
		}

		// The canvas normalizes an opaque fillStyle to #rrggbb.
		function toRgb(color) {
			context.fillStyle = color;
			const hex = context.fillStyle;
			return [1, 3, 5].map((start) => parseInt(hex.slice(start, start + 2), 16));
		}

		function letterColors() {
			const colors = [];
			for (let i = 0; i < word.length; i++) {
				colors.push(toRgb(cssColor(`--letter-${i % MAX_WORD_LENGTH}`)));
			}
			return colors;
		}

		function draw() {
			const isDrawable = word.length >= MIN_WORD_LENGTH;
			canvas.hidden = !isDrawable;
			hint.textContent = isDrawable
				? `Up to ${MAX_WORD_LENGTH} letters`
				: 'Type a word';
			if (!isDrawable) {
				return;
			}

			const { width: wordWidth, height: wordHeight } = wordSize(word);
			const ratio = window.devicePixelRatio || 1;
			const cssWidth = canvas.clientWidth;
			const cssMargin = cssWidth * MARGIN_RATIO;
			// A short word is tall for its width, so the height can limit the
			// scale too. The drawing then centers horizontally.
			const availableHeight = window.innerHeight - form.offsetHeight;
			const cssScale = Math.max(0, Math.min(
				(cssWidth - 2 * cssMargin) / wordWidth,
				(availableHeight - 2 * cssMargin) / wordHeight
			));
			const cssHeight = wordHeight * cssScale + 2 * cssMargin;
			const cssOffsetX = (cssWidth - wordWidth * cssScale) / 2;

			canvas.style.height = `${cssHeight}px`;
			canvas.width = Math.round(cssWidth * ratio);
			canvas.height = Math.round(cssHeight * ratio);

			const margin = cssMargin * ratio;
			const offsetX = cssOffsetX * ratio;
			const scale = cssScale * ratio;
			const pixelCount = canvas.width * canvas.height;
			const colors = letterColors();

			// Each pixel keeps a hit count and the summed color of its hits, so
			// busy pixels get brighter and mixed pixels get a blended color.
			const hits = new Uint32Array(pixelCount);
			const red = new Uint32Array(pixelCount);
			const green = new Uint32Array(pixelCount);
			const blue = new Uint32Array(pixelCount);

			const iterations = Math.round(ITERATIONS_PER_CSS_PIXEL_RATIO * ratio * ratio);
			iterate(rules, iterations, BURN_IN, Math.random, (x, y, letter) => {
				const px = Math.floor(offsetX + x * scale);
				// Canvas y points down, and the word's y points up.
				const py = Math.floor(canvas.height - margin - y * scale);
				if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) {
					return;
				}
				const index = py * canvas.width + px;
				const [r, g, b] = colors[letter];
				hits[index]++;
				red[index] += r;
				green[index] += g;
				blue[index] += b;
			});

			// Overlapping strokes collect far more hits than the rest of the word.
			// Scaling brightness to a high percentile instead of the maximum keeps
			// those few pixels from dimming everything else.
			const litCounts = hits.filter((count) => count > 0).sort();
			const referenceHits = litCounts[Math.floor(litCounts.length * BRIGHTNESS_PERCENTILE)] || 1;

			const [bgRed, bgGreen, bgBlue] = toRgb(cssColor('--bg'));
			const image = context.createImageData(canvas.width, canvas.height);
			const logReference = Math.log1p(referenceHits);
			for (let i = 0; i < pixelCount; i++) {
				const offset = i * 4;
				const count = hits[i];
				// A log scale keeps lightly hit pixels visible next to dense ones.
				const brightness = count === 0 ? 0 : Math.min(1, Math.log1p(count) / logReference);
				const r = count === 0 ? bgRed : red[i] / count;
				const g = count === 0 ? bgGreen : green[i] / count;
				const b = count === 0 ? bgBlue : blue[i] / count;
				image.data[offset] = bgRed + (r - bgRed) * brightness;
				image.data[offset + 1] = bgGreen + (g - bgGreen) * brightness;
				image.data[offset + 2] = bgBlue + (b - bgBlue) * brightness;
				image.data[offset + 3] = 255;
			}

			context.putImageData(image, 0, 0);
		}

		// The address keeps the current word, so a link opens the same drawing.
		function setWord(newWord) {
			word = newWord;
			rules = word.length >= MIN_WORD_LENGTH ? buildRules(word) : [];

			const url = new URL(window.location.href);
			url.searchParams.set('word', word);
			history.replaceState(null, '', url);

			draw();
		}

		let typingTimer;
		input.addEventListener('input', () => {
			const normalized = normalizeWord(input.value);
			if (input.value !== normalized) {
				input.value = normalized;
			}
			clearTimeout(typingTimer);
			typingTimer = setTimeout(() => setWord(normalized), TYPING_DEBOUNCE_MS);
		});

		// Enter draws at once instead of waiting for the debounce.
		form.addEventListener('submit', (event) => {
			event.preventDefault();
			clearTimeout(typingTimer);
			setWord(normalizeWord(input.value));
		});

		let resizeTimer;
		window.addEventListener('resize', () => {
			clearTimeout(resizeTimer);
			resizeTimer = setTimeout(draw, RESIZE_DEBOUNCE_MS);
		});

		const requested = new URLSearchParams(window.location.search).get('word');
		const initialWord = requested === null ? DEFAULT_WORD : normalizeWord(requested);
		input.value = initialWord;
		setWord(initialWord);
	</script>
</body>
</html>
